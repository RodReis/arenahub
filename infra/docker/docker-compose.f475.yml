# Override local, so para a worktree da F475 -- container names e volumes
# distintos da bancada principal e das outras worktrees.
# SEMPRE com `-p arenahub-f475`: sem nome de projeto proprio, o compose
# RENOMEIA os containers da bancada principal em vez de criar um conjunto
# novo.
# Uso: docker compose -p arenahub-f475 --env-file .env -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.f475.yml up -d
services:
  postgres:
    container_name: arenahub-f475-postgres
    volumes:
      - postgres-data-f475:/var/lib/postgresql/data
  redis:
    container_name: arenahub-f475-redis
    volumes:
      - redis-data-f475:/data
  minio:
    container_name: arenahub-f475-minio
    volumes:
      - minio-data-f475:/data
volumes:
  postgres-data-f475:
  redis-data-f475:
  minio-data-f475:
