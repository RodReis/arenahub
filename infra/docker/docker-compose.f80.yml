# Override local, so para a worktree da F80 -- container names e volumes
# distintos da bancada principal e da F78.
# SEMPRE com `-p arenahub-f80`: sem nome de projeto proprio, o compose
# RENOMEIA os containers da bancada principal em vez de criar um conjunto
# novo, e a main fica fora do ar (aconteceu na F79).
# Uso: docker compose -p arenahub-f80 --env-file .env -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.f80.yml up -d
services:
  postgres:
    container_name: arenahub-f80-postgres
    volumes:
      - postgres-data-f80:/var/lib/postgresql/data
  redis:
    container_name: arenahub-f80-redis
    volumes:
      - redis-data-f80:/data
  minio:
    container_name: arenahub-f80-minio
    volumes:
      - minio-data-f80:/data
volumes:
  postgres-data-f80:
  redis-data-f80:
  minio-data-f80:
