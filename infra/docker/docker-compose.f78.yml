# Override local, so para a worktree da F78 -- container names e volumes
# distintos da bancada principal, que ja roda em arenahub-postgres/-redis/-minio.
# Uso: docker compose --env-file .env -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.f78.yml up -d

services:
  postgres:
    container_name: arenahub-f78-postgres
    volumes:
      - postgres-data-f78:/var/lib/postgresql/data

  redis:
    container_name: arenahub-f78-redis
    volumes:
      - redis-data-f78:/data

  minio:
    container_name: arenahub-f78-minio
    volumes:
      - minio-data-f78:/data

volumes:
  postgres-data-f78:
  redis-data-f78:
  minio-data-f78:
