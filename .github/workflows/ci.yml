# CI do ArenaHub — o portão de merge.
#
# No processo do trio, o merge é do próprio Code: o PI não segura o código na
# porta da `main`. A única coisa entre uma entrega ruim e a `main` são estes
# dois jobs. Por isso eles falham explicitamente e nunca "passam mesmo assim".
#
# Ordem por custo crescente — falhe cedo, falhe barato (docs/TESTING.md §6).
#
# DOIS jobs em paralelo, e não um em série: `rapido` não depende de banco nem
# de navegador, então não tem por que esperar na fila atrás deles. Ambos são
# obrigatórios para o merge — paralelizar encurta o relógio, não a barra.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # PR novo cancela a execução anterior da mesma branch; na main, nunca
  # cancela — cada commit da main merece seu próprio resultado.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Turbo em CI: sem cor no log, que é o que o guarda de tasks já não depende
  # mais, mas mantém o log legível no GitHub.
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  # ---------------------------------------------------------------------------
  # Job rápido: tudo que só precisa de disco e CPU. Sem Postgres, sem
  # navegador. É aqui que mora a barreira que pega o erro bobo em menos de um
  # minuto.
  # ---------------------------------------------------------------------------
  rapido:
    name: lint, typecheck, guardas e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # A versão sai do .nvmrc — fonte única com o desenvolvimento local.
          node-version-file: .nvmrc
          cache: pnpm

      # --- 1 de 8 ---------------------------------------------------------
      - name: install
        run: pnpm install --frozen-lockfile

      # O client do Prisma é gerado, não versionado (`src/generated/` está no
      # .gitignore). Sem este passo, lint e typecheck falham no CI e passam na
      # máquina de quem já rodou `generate` -- verde local, vermelho remoto,
      # que é o pior tipo de divergência. Vem antes do lint de propósito.
      #
      # `DATABASE_URL` aqui é de mentira, e é isso mesmo: `prisma generate` lê
      # o schema e escreve o client -- não abre conexão. O que ele exige é que
      # a variável EXISTA, porque o `prisma.config.ts` a resolve ao carregar.
      # Sem ela o passo morre com `PrismaConfigEnvError` antes de gerar nada.
      #
      # A URL fica no passo, não no job: dar `env` de banco ao job inteiro
      # abriria a porta para um teste deste job conectar em algo que não
      # existe -- este job não tem Postgres, e não deve ter.
      - name: gerar client do Prisma
        run: pnpm --filter @arenahub/database generate
        env:
          DATABASE_URL: postgresql://prisma:generate@localhost:5432/nao-conecta?schema=public

      # `theme.css` e `tokens.generated.ts` são gerados a partir de
      # `packages/ui/tokens/*.json` e VERSIONADOS — ao contrário do client do
      # Prisma acima. A razão é o `--check`: com o gerado no repositório, o CI
      # compara o que está commitado com o que a fonte produz agora, e reprova
      # se alguém editou o CSS à mão ou mexeu no JSON sem regerar.
      #
      # Este passo é também onde a regra 4 de lint do design system vive
      # (`docs/design/DS-PAINEL.md` §11). Ela não é sintática — nenhum ESLint
      # sabe medir contraste —, então roda aqui: par texto/superfície abaixo
      # do alvo derruba o build, incluindo os pares derivados do accent.
      #
      # Vem antes do lint porque é mais barato e porque `tokens.generated.ts`
      # é fonte de tipo: sem ele, o typecheck falharia apontando para o
      # sintoma (arquivo inexistente) em vez da causa.
      - name: tokens do design system (contraste e sincronia)
        run: pnpm --filter @arenahub/ui build:tokens -- --check

      # --- 2 de 8 ---------------------------------------------------------
      - name: lint
        run: pnpm lint

      # --- 3 de 8 ---------------------------------------------------------
      - name: typecheck
        run: pnpm typecheck

      # --- guardas do próprio repositório ---------------------------------
      # Não estão na lista dos 8 do TESTING.md §6 porque não são teste de
      # domínio. Rodam aqui porque um guarda quebrado não avisa que quebrou:
      # ele simplesmente deixa passar.
      - name: guardas de scripts/
        run: pnpm test:guardas

      - name: self-check do gerador de relatório
        run: pnpm test:report:selfcheck

      # --- 8 de 8, promovida para cá --------------------------------------
      # A guarda de evidência. Falha se reports/TESTS.md divergir do que a
      # varredura produz -- número em documento tem de vir de execução, nunca
      # de prosa (docs/TESTING.md §5).
      #
      # Ela era o ÚLTIMO passo do workflow antigo, depois do E2E inteiro, e
      # custava ~4min para reportar um diff de duas linhas (issue #77). Está
      # aqui porque `--check` não depende de teste ter rodado NESTE job: ele
      # audita se `reports/TESTS.md` bate com `reports/.test-report-cache.json`
      # -- os dois commitados por quem entregou (`pnpm test:report --issue N`,
      # rodado localmente antes do commit final). Não afrouxou nada -- continua
      # barrando o merge, só barra mais cedo, e além disso ficou determinístico
      # (não re-executa nada, então o crash intermitente do Jest no Windows,
      # docs/TESTING.md §5, não pode fazer `--check` mudar de opinião).
      - name: guarda de evidência
        run: pnpm test:report --check

      # --- 4 de 8 ---------------------------------------------------------
      # Promovido a passo próprio na F1, quando `apps/edge-agent` nasceu e
      # passou a declarar `test`. Antes disso vivia na lista de pendentes.
      - name: test (unitário + contrato)
        run: pnpm test

      # --- 6 de 8 ---------------------------------------------------------
      # Promovido na F1, mesmo motivo.
      - name: build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Job pesado: o que precisa de Postgres e de navegador. Roda em paralelo com
  # o rápido, e duplica o `install` -- o cache do pnpm paga a diferença.
  # ---------------------------------------------------------------------------
  pesado:
    name: integração e E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # O job roda DENTRO da imagem oficial do Playwright -- issue #105.
    #
    # Ela já traz o Chromium e as bibliotecas de sistema dele, então some o
    # `apt-get` do caminho crítico. Era ele que dependia do mirror
    # `azure.archive.ubuntu.com`, fora do ar QUATRO vezes em 18/08/2026: as
    # duas primeiras derrubaram o job aos 20 min (antes do #94), as outras
    # duas no timeout de 8 min que o #94 criou. Timeout curto mais uma
    # tentativa extra faz a queda aparecer no passo certo, mas não cobre
    # mirror fora por minutos -- as duas tentativas caem na mesma janela.
    #
    # A tag SEGUE a versão de `@playwright/test` no `apps/admin-web`. Imagem e
    # biblioteca desalinhadas quebram de formas obscuras: o driver da lib fala
    # com um navegador que não é o dele. Ao subir o Playwright, suba aqui
    # junto.
    container: mcr.microsoft.com/playwright:v1.62.1-noble

    # A imagem guarda os navegadores em `/ms-playwright` e anuncia isso pela
    # env var `PLAYWRIGHT_BROWSERS_PATH` que ela mesma define. Essa var NAO
    # chega ao processo do job: o runner troca o `HOME` para `/github/home` e
    # monta o proprio ambiente, entao o Playwright volta ao padrao
    # `~/.cache/ms-playwright` -- um caminho vazio -- e morre com
    # "Executable doesn't exist at /github/home/.cache/ms-playwright/...".
    #
    # Repetir a var aqui e o que faz o job enxergar os navegadores que a imagem
    # ja traz. O valor ESPELHA o `ENV` do Dockerfile oficial: se a imagem mudar
    # de caminho, este valor muda junto.

    services:
      # Postgres para `test:integration` e para o E2E, cada um no seu banco.
      #
      # NÃO é Testcontainers: as suítes falam com este serviço pelas
      # `*_DATABASE_URL` abaixo. O comentário anterior dizia o contrário e
      # estava errado -- mesma correção feita no `docs/TESTING.md` na #101.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arenahub
          POSTGRES_PASSWORD: arenahub_ci
          POSTGRES_DB: arenahub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arenahub -d arenahub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Onde a imagem guarda os navegadores -- ver o bloco do `container`
      # acima. Sem esta linha o Playwright procura em `~/.cache/ms-playwright`,
      # que dentro do job e `/github/home/.cache/ms-playwright`, e nao acha
      # nada.
      #
      # Declarar AQUI nao basta: a task passa pelo Turbo, que sanitiza o
      # ambiente e descarta variavel fora do `globalEnv`. Esta precisa estar
      # NOS DOIS lugares -- aqui e no `turbo.json`.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

      # `postgres`, e NÃO `localhost`: com o job dentro de um container, o
      # runner liga os dois por uma rede Docker e o serviço passa a atender
      # pelo LABEL dele. Em `localhost` mora o próprio job.
      #
      # Errar isso não dá erro de rede legível -- dá recusa de conexão ou
      # `database does not exist`, que parecem problema de migration e mandam
      # quem investiga para o lado errado.
      DATABASE_URL: postgresql://arenahub:arenahub_ci@postgres:5432/arenahub?schema=public
      # Banco separado para a suite E2E -- card [INFRA], issue #101. A suite
      # CRIA aluno, plano e dispositivo e NAO limpa; apontada para o banco
      # acima, contamina o que `test:integration` acabou de limpar. O
      # `pretest:e2e` recria este banco do zero antes de cada execucao, entao
      # nao e preciso cria-lo no service container.
      E2E_DATABASE_URL: postgresql://arenahub:arenahub_ci@postgres:5432/arenahub_e2e?schema=public
      # Banco separado para a integracao, pelo mesmo motivo do E2E: de 20
      # suites, 3 apagam o tenant no fim e 17 deixam. E NAO o mesmo banco do
      # E2E -- as duas suites rodam no mesmo job, e uma derrubaria o banco sob
      # os pes da outra.
      INTEGRATION_DATABASE_URL: postgresql://arenahub:arenahub_ci@postgres:5432/arenahub_int?schema=public

      # Chave de cifra dos segredos simetricos. FIXA no CI, e nao efemera,
      # porque o E2E do totem exige que o SEED e a API usem a mesma: o seed
      # grava a credencial `dev-totem01` cifrada com ela, e a API precisa
      # decifrar. Com chave nova a cada arranque, o seed pularia a credencial
      # e toda identificacao cairia na mensagem neutra -- a jornada nao
      # aconteceria, e um E2E mal escrito ficaria verde mesmo assim.
      #
      # VALOR DESCARTAVEL de CI, gerado para este arquivo e para mais nada.
      # Nao protege nada: o banco do job nasce e morre com ele.
      # 32 bytes exatos em base64 (`ci-descartavel-nao-protege-nada!`) -- a
      # API recusa qualquer outro tamanho no arranque.
      MFA_ENCRYPTION_KEY: Y2ktZGVzY2FydGF2ZWwtbmFvLXByb3RlZ2UtbmFkYSE=

      # Credencial do totem que o seed cria. Segredo PUBLICADO de proposito:
      # e o mesmo do `.env.example`, para bancada e E2E. Producao usa secret
      # manager, com credencial gerada pelo painel (F50).
      KIOSK_KEY_ID: dev-totem01
      KIOSK_SECRET: segredo-de-bancada-do-totem-nao-use-em-producao

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: gerar client do Prisma
        run: pnpm --filter @arenahub/database generate

      # --- 5 de 8 ---------------------------------------------------------
      # Promovido na F6, quando `apps/api` e `packages/database` nasceram e
      # passaram a declarar a task -- exatamente o que o passo de pendentes
      # abaixo mandava fazer.
      #
      # A migration roda antes: o schema do banco de serviço está vazio, e
      # `prisma migrate deploy` (não `dev`) é o comando de ambiente não
      # interativo -- ele aplica o que está versionado e falha se faltar
      # migration, em vez de gerar uma nova em cima da hora.
      - name: aplicar migrations
        run: pnpm --filter @arenahub/database exec prisma migrate deploy

      - name: 'test:integration'
        run: pnpm test:integration

      # --- 7 de 8 ---------------------------------------------------------
      # Promovido na F6 (Task 6), quando o Playwright nasceu no admin-web.
      # Com ele, OS OITO PASSOS têm workspace: a lista de pendentes acabou.
      #
      # O `build` roda aqui também, e não só no job rápido: o `webServer` do
      # playwright.config.ts sobe `next start` e `node dist/main.js`, que são
      # os artefatos compilados. `dependsOn: ["^build"]` do turbo constrói as
      # DEPENDÊNCIAS da task, não o próprio app -- sem este passo o E2E sobe
      # contra um `dist/` que não existe.
      - name: build
        run: pnpm build

      # O `seed` roda antes porque a jornada E2E entra com um proprietário
      # real -- e é o seed que o cria (`CLAUDE.md`: dado local de
      # desenvolvimento entra por seed).
      - name: seed de bancada
        run: pnpm --filter @arenahub/database seed

      # Sem passo de navegador: a imagem do job já traz o Chromium em
      # `/ms-playwright` (`PLAYWRIGHT_BROWSERS_PATH`) e as bibliotecas de
      # sistema dele. Saíram daqui, com a #105:
      #
      #   - `playwright install --with-deps chromium` e `install-deps`, os dois
      #     passos que chamavam `apt-get` e dependiam do mirror do Ubuntu;
      #   - o cache de `~/.cache/ms-playwright`, que a imagem torna trabalho
      #     morto: ela aponta o Playwright para `/ms-playwright`, então o cache
      #     seria restaurado num caminho que ninguém lê;
      #   - o passo que resolvia a versão do Playwright para chavear esse cache.
      #
      # A versão agora vive na tag da imagem, no topo do job.

      - name: 'test:e2e'
        run: pnpm test:e2e

      - name: guardar rastro do Playwright quando falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # As duas suites (admin-web e a do totem, F49) tem `trace:
          # 'retain-on-failure'` e `screenshot: 'only-on-failure'`, mas isso
          # so grava em test-results/ -- playwright-report/ so existe com o
          # reporter `html`, ligado nos dois playwright.config.ts (guarda
          # `reporter: [..., ['html', { outputFolder: 'playwright-report' }]]`
          # quando `CI`). O html embute trace e screenshot no proprio
          # relatorio; sem o reporter, este `path` apontaria para um
          # diretorio que o CI nunca cria.
          path: |
            apps/admin-web/playwright-report/
            apps/kiosk/playwright-report/
          retention-days: 7
