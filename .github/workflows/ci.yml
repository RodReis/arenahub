# CI do ArenaHub — o portão de merge.
#
# No processo do trio, o merge é do próprio Code: o PI não segura o código na
# porta da `main`. A única coisa entre uma entrega ruim e a `main` é este
# arquivo. Por isso ele falha explicitamente e nunca "passa mesmo assim".
#
# Ordem por custo crescente — falhe cedo, falhe barato (docs/TESTING.md §6).

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # PR novo cancela a execução anterior da mesma branch; na main, nunca
  # cancela — cada commit da main merece seu próprio resultado.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Turbo em CI: sem cor no log, que é o que o guarda de tasks já não depende
  # mais, mas mantém o log legível no GitHub.
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  ci:
    name: build, lint, typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Postgres para `test:integration`. Testcontainers sobe o que precisar
      # por conta, mas o serviço aqui cobre o caso simples e é mais rápido.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arenahub
          POSTGRES_PASSWORD: arenahub_ci
          POSTGRES_DB: arenahub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arenahub -d arenahub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://arenahub:arenahub_ci@localhost:5432/arenahub?schema=public

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # A versão sai do .nvmrc — fonte única com o desenvolvimento local.
          node-version-file: .nvmrc
          cache: pnpm

      # --- 1 de 8 ---------------------------------------------------------
      - name: install
        run: pnpm install --frozen-lockfile

      # O client do Prisma é gerado, não versionado (`src/generated/` está no
      # .gitignore). Sem este passo, lint e typecheck falham no CI e passam na
      # máquina de quem já rodou `generate` -- verde local, vermelho remoto,
      # que é o pior tipo de divergência. Vem antes do lint de propósito.
      - name: gerar client do Prisma
        run: pnpm --filter @arenahub/database generate

      # --- 2 de 8 ---------------------------------------------------------
      - name: lint
        run: pnpm lint

      # --- 3 de 8 ---------------------------------------------------------
      - name: typecheck
        run: pnpm typecheck

      # --- guardas do próprio repositório ---------------------------------
      # Não estão na lista dos 8 do TESTING.md §6 porque não são teste de
      # domínio. Rodam aqui porque um guarda quebrado não avisa que quebrou:
      # ele simplesmente deixa passar.
      - name: guardas de scripts/
        run: pnpm test:guardas

      - name: self-check do gerador de relatório
        run: pnpm test:report:selfcheck

      # --- 4 de 8 ---------------------------------------------------------
      # Promovido a passo próprio na F1, quando `apps/edge-agent` nasceu e
      # passou a declarar `test`. Antes disso vivia na lista de pendentes.
      - name: test (unitário + contrato)
        run: pnpm test

      # --- 6 de 8 ---------------------------------------------------------
      # Promovido na F1, mesmo motivo.
      - name: build
        run: pnpm build

      # --- 5 de 8 ---------------------------------------------------------
      # Promovido na F6, quando `apps/api` e `packages/database` nasceram e
      # passaram a declarar a task -- exatamente o que o passo de pendentes
      # abaixo mandava fazer.
      #
      # A migration roda antes: o schema do banco de serviço está vazio, e
      # `prisma migrate deploy` (não `dev`) é o comando de ambiente não
      # interativo -- ele aplica o que está versionado e falha se faltar
      # migration, em vez de gerar uma nova em cima da hora.
      - name: aplicar migrations
        run: pnpm --filter @arenahub/database exec prisma migrate deploy

      - name: 'test:integration'
        run: pnpm test:integration

      # --- 7 de 8 ---------------------------------------------------------
      # Promovido na F6 (Task 6), quando o Playwright nasceu no admin-web.
      # Com ele, OS OITO PASSOS têm workspace: a lista de pendentes acabou.
      #
      # O `seed` roda antes porque a jornada E2E entra com um proprietário
      # real -- e é o seed que o cria (`CLAUDE.md`: dado local de
      # desenvolvimento entra por seed).
      #
      # `--with-deps` instala as bibliotecas de sistema do Chromium que o
      # runner do GitHub não traz.
      - name: seed de bancada
        run: pnpm --filter @arenahub/database seed

      - name: instalar navegador do Playwright
        run: pnpm --filter @arenahub/admin-web exec playwright install --with-deps chromium

      - name: 'test:e2e'
        run: pnpm test:e2e

      - name: guardar rastro do Playwright quando falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/admin-web/playwright-report/
          retention-days: 7

      # --- 8 de 8 ---------------------------------------------------------
      # A guarda de evidência. Falha se reports/TESTS.md divergir do que a
      # execução produz -- número em documento tem de vir de execução, nunca
      # de prosa (docs/TESTING.md §5). Esta barra o merge desde já.
      - name: guarda de evidência
        run: pnpm test:report --check
